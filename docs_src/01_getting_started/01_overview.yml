id: OVERVIEW
title: Getting Started & System Overview
summary: Introduction to Celestine SVG generation DSL and object model.
track: 01_getting_started
overview: |
  Celestine is a fast, pure-Crystal library for programmatic SVG generation.
  It provides both a fluent builder DSL and a strongly-typed object model for
  creating, transforming, styling, and animating SVG graphics.

related_sources:
  - "src/celestine.cr"
  - "src/drawables/"
  - "src/effects/"

sections:
  - id: topic_01_introduction
    title: Introduction & Architecture
    summary: Core concepts and structural layout of Celestine.
    content: |
      Celestine organizes SVG generation around three pillars:

      1. **Drawables**: Core SVG elements such as `<svg>`, `<rect>`, `<circle>`, `<ellipse>`, `<line>`, `<polygon>`, `<polyline>`, `<path>`, `<text>`, `<image>`, and `<use>`.
      2. **Containers & Definitions**: `<g>`, `<a>`, `<defs>`, `<mask>`, `<marker>`, `<pattern>`, `<linearGradient>`, and `<radialGradient>`.
      3. **Effects & Animations**: Declarative SVG filters (`<filter>`, `<feGaussianBlur>`, etc.) and SMIL animations (`<animate>`, `<animateMotion>`, `<animateTransform>`).

      | Component | Module / Directory | Role |
      | :--- | :--- | :--- |
      | Root DSL | `Celestine.draw` | Builder entrypoint yielding `Celestine::Svg` |
      | Drawables | `src/drawables/` | Concrete SVG tag implementations inheriting `Celestine::Drawable` |
      | Effects | `src/effects/` | Gradients, filters, masks, markers, patterns, animations |
      | Math | `src/math/` | `Point`, `FPoint`, and coordinate manipulation |

    examples:
      - |
        ```crystal
        require "celestine"

        svg = Celestine.draw do |ctx|
          ctx.view_box = {x: 0, y: 0, w: 200, h: 200}
          ctx.rectangle do |r|
            r.x = 10
            r.y = 10
            r.width = 180
            r.height = 180
            r.fill = "blue"
            r.radius_x = 8
            r.radius_y = 8
          end
        end

        puts svg
        ```

    pitfalls:
      - "Never forget to set view_box or width/height on the root SVG for proper scaling."
      - "Remember that units default to pixels if none are specified."

    faqs:
      - q: "How do I stream SVG directly to an IO instead of allocating a String?"
        a: "Call Celestine.draw(io) { |ctx| ... } to render directly to any IO object."
      - q: "Can I use Celestine without the DSL block syntax?"
        a: "Yes! Every drawable and effect is a standard Crystal class (e.g. Celestine::Rectangle.new) that can be instantiated and appended to any container."