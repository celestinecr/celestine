name: Crystal CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: build
    runs-on: ubuntu-latest

    container:
      image: crystallang/crystal:latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Install dependencies
      run: shards install
    - name: Run specs
      run: crystal spec
    - name: Build targets
      run: |
        shards build logo
        shards build benchmark
        shards build carbon
        shards build jasper
